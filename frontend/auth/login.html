<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQFleet - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="auth-card p-4 p-md-5 style-container" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-warning mb-0">IQ<span class="text-white">Fleet</span></h2>
      <span class="badge bg-secondary text-uppercase mt-1">v0.1 Mockup</span>
    </div>

    <form id="loginForm">
      <!----- Selecione el Rol Administrador / Conductor ----->
      <label class="form-label text-secondary small fw-bold">SELECCIONA TU ROL</label>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <div class="role-card p-3 text-center selected" id="roleAdmin" onclick="selectRole('Administrador')">
            <i class="bi bi-person-badge fs-3 text-warning"></i>
            <div class="small fw-bold mt-1">Administrador</div>
          </div>
        </div>
        <div class="col-6">
          <div class="role-card p-3 text-center" id="roleDriver" onclick="selectRole('Conductor')">
            <i class="bi bi-bus-front fs-3 text-warning"></i>
            <div class="small fw-bold mt-1">Conductor</div>
          </div>
        </div>
      </div>

      <!-- Correo -->
      <div class="mb-3">
        <label for="email" class="form-label text-secondary small">Correo corporativo</label>
        <input type="email" class="form-control bg-dark text-white border-secondary" id="email" required placeholder="ejemplo@iqfleet.com">
      </div>

      <!-- Contraseña + Ver/Ocultar -->
      <div class="mb-3">
        <label for="password" class="form-label text-secondary small">Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control bg-dark text-white border-secondary" id="password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Opciones secundarias -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label text-secondary small" for="rememberMe">Mantener sesión</label>
        </div>
        <a href="#" id="forgotPassword" class="text-warning text-decoration-none small">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-iq-primary w-100 py-2">Ingresar a IQFleet</button>
    </form>
  </div>

  <script src="../data/usuarios.mock.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../pages/auth-login.js"></script>
</body>
</html>
