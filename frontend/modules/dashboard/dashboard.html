<!-- TÍTULO DE LA SECCIÓN -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h3 class="fw-bold text-white mb-1">
            Consola de Control Operativo
        </h3>

        <p class="text-secondary small mb-0">
            Monitoreo ejecutivo en tiempo real de métricas y rendimiento de flota.
        </p>

    </div>

</div>


<!-- =========================================
     TARJETAS DE KPIS
     ========================================= -->

<div class="row g-3 mb-4">

    <div class="col-md-3">

        <div class="card card-custom p-3">

            <span class="text-secondary small">
                Unidades Activas
            </span>

            <h3 class="fw-bold text-white mt-1">
                24

                <span class="fs-6 text-success font-monospace">
                    ↑ 98%
                </span>
            </h3>

        </div>

    </div>


    <div class="col-md-3">

        <div class="card card-custom p-3">

            <span class="text-secondary small">
                Alertas de Telemetría
            </span>

            <h3 class="fw-bold text-warning mt-1">
                3

                <span class="fs-6 text-danger font-monospace">
                    Atención
                </span>
            </h3>

        </div>

    </div>


    <div class="col-md-3">

        <div class="card card-custom p-3">

            <span class="text-secondary small">
                Eficiencia de Flota
            </span>

            <h3 class="fw-bold text-white mt-1">
                88.5%

                <span class="fs-6 text-info font-monospace">
                    Estable
                </span>
            </h3>

        </div>

    </div>


    <div class="col-md-3">

        <div class="card card-custom p-3">

            <span class="text-secondary small">
                Conductores en Turno
            </span>

            <h3 class="fw-bold text-white mt-1">
                18

                <span class="fs-6 text-success font-monospace">
                    Activos
                </span>
            </h3>

        </div>

    </div>

</div>


<!-- =========================================
     GRÁFICOS
     ========================================= -->

<div class="row g-4">

    <!-- Gráfico de rendimiento -->

    <div class="col-lg-8">

        <div class="card card-custom p-4">

            <h5 class="text-white mb-3">
                Rendimiento Semanal de la Flota
            </h5>

            <canvas
                id="graficoRendimiento"
                height="130"
            ></canvas>

        </div>

    </div>


    <!-- Gráfico de balance -->

    <div class="col-lg-4">

        <div class="card card-custom p-4">

            <h5 class="text-white mb-3">
                Balance de Consumo
            </h5>

            <canvas
                id="graficoBalance"
                height="260"
            ></canvas>

        </div>

    </div>

</div>
