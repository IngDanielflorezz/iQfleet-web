<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iQFleet - Dashboard Ejecutivo</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Estilos generales -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

    <!-- =========================================
         BARRA LATERAL
         ========================================= -->
    <div class="sidebar">

        <div class="sidebar-brand">
            <span>
                iQFleet
                <span
                    class="badge bg-warning text-dark fs-6"
                    style="font-size: 0.6rem!important;"
                >
                    PRO v2.4
                </span>
            </span>
        </div>

        <div class="menu-label">
            Menú Operativo
        </div>

        <!-- Navegación -->
        <a href="#/dashboard" class="nav-link-custom" data-route="dashboard">
            Dashboard Ejecutivo
        </a>

        <a href="#/vehiculos" class="nav-link-custom" data-route="vehiculos">
            Flota & Vehículos
        </a>

        <a href="#/conductores" class="nav-link-custom" data-route="conductores">
            Conductores
        </a>

        <a href="#/documentos" class="nav-link-custom" data-route="documentos">
            Control Documental

            <span class="badge bg-danger ms-auto">
                8
            </span>
        </a>

        <a href="#/finanzas" class="nav-link-custom" data-route="finanzas">
            Finanzas & Rentabilidad
        </a>

        <a href="#/mantenimiento" class="nav-link-custom" data-route="mantenimiento">
            Mantenimiento & Rutas
        </a>

        <a href="#/configuracion" class="nav-link-custom" data-route="configuracion">
            Configuración
        </a>


        <!-- =========================================
             USUARIO
             ========================================= -->
        <div
            class="mt-auto p-3 border-top border-secondary d-flex align-items-center justify-content-between"
        >

            <div class="d-flex align-items-center">

                <div
                    class="bg-warning text-dark rounded-circle fw-bold d-flex align-items-center justify-content-center me-2"
                    style="width: 35px; height: 35px;"
                    id="user-initials"
                >
                    CM
                </div>

                <div>

                    <h6
                        class="mb-0 fs-6 text-white"
                        id="user-name"
                    >
                        Usuario
                    </h6>

                    <small
                        class="text-warning"
                        style="font-size: 0.7rem;"
                        id="user-role"
                    >
                        ADMINISTRADOR
                    </small>

                </div>

            </div>

            <button
                class="btn btn-sm btn-outline-danger"
                onclick="cerrarSesion()"
                title="Cerrar Sesión"
            >
                Cerrar sesión
            </button>

        </div>

    </div>


    <!-- =========================================
         CONTENIDO PRINCIPAL
         ========================================= -->
    <div class="main-content">

        <!-- Barra superior -->
        <div
            class="top-navbar d-flex align-items-center justify-content-between mb-4"
        >

            <div class="input-group w-25">

                <input
                    type="text"
                    class="form-control search-input"
                    placeholder="Buscar vehículos, placas..."
                >

            </div>

            <div class="d-flex align-items-center gap-3">

                <span
                    class="badge bg-success bg-opacity-10 text-success badge-status border border-success"
                >
                    18 En ruta (90%)
                </span>

                <span class="text-secondary small">
                    Hoy: 24 Octubre 2024
                </span>

                <button
                    class="btn btn-warning fw-bold text-dark btn-sm px-3"
                >
                    + Nuevo Registro
                </button>

            </div>

        </div>


        <!-- =========================================
             CONTENIDO DINÁMICO
             ========================================= -->

        <main id="app-content">

            <!-- Los módulos se cargarán aquí -->

        </main>

    </div>


    <!-- =========================================
         ROUTER
         ========================================= -->

    <script type="module" src="../core/router.js"></script>

</body>

</html>
