<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQFleet - Iniciar Sesión</title>

  <!-- Se eliminan las conexiones predeterminadas y fuentes de Google -->
  
  <!-- Iconos de Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Framework Bootstrap 5 y Hoja de Estilos Personalizada -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/login.css">

  <!-- Carga diferida de scripts en orden modular -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../data/usuarios.mock.js" defer></script>
  <script src="../core/storage.js" defer></script>
  <script src="../auth/auth-login.js" defer></script>
</head>
<body class="bg-grid-pattern min-vh-100 d-flex flex-column justify-content-between align-items-center p-3 p-md-4">


  <!-- Tarjeta central de credenciales -->
  <main class="w-100 my-auto login-container">
    <div class="login-card position-relative overflow-hidden">
      <div class="top-line-gradient"></div>

      <!-- Cabecera de marca iQFleet -->
      <div class="d-flex align-items-start justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
          <div class="brand-logo d-flex align-items-center justify-content-center text-white fw-bold">iQ</div>
          <div>
            <div class="d-flex align-items-center gap-2">
              <h1 class="h4 fw-bold m-0 text-brand-dark">iQFleet</h1>
            </div>
            <p class="small text-slate-500 fw-medium m-0 mt-1">Plataforma Inteligente de Transporte Público</p>
          </div>
        </div>
      </div>

      <form id="loginForm" class="d-flex flex-column gap-3">
        <!-- Selector interactivo de Roles -->
        <div>
          <label class="form-label-custom">SELECCIONA TU ROL</label>
          <div class="row g-2">
            <div class="col-6">
              <button type="button" class="btn-role active w-100" id="roleAdmin" onclick="selectRole('Administrador')">
                <div class="d-flex align-items-center justify-content-between w-100">
                  <div class="d-flex align-items-center gap-2">
                    <div class="role-icon bg-amber text-white"><i class="fa-solid fa-user-tie"></i></div>
                    <span class="fw-bold text-brand-dark small">Administrador</span>
                  </div>
                </div>
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn-role w-100" id="roleDriver" onclick="selectRole('Conductor')">
                <div class="d-flex align-items-center justify-content-between w-100">
                  <div class="d-flex align-items-center gap-2">
                    <div class="role-icon bg-slate-200 text-slate-600"><i class="fa-solid fa-id-card"></i></div>
                    <span class="fw-semibold text-slate-700 small">Conductor</span>
                  </div>
                </div>
              </button>
            </div>
          </div>
        </div>

        <!-- Campo de Correo Corporativo -->
        <div>
          <label for="email" class="form-label-custom">CORREO CORPORATIVO</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control form-control-custom" value="admin@iqfleet.com" required placeholder="ejemplo@iqfleet.com">
          </div>
        </div>

        <!-- Campo de Contraseña -->
        <div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label-custom m-0">CONTRASEÑA</label>
            <a href="#" class="small-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control form-control-custom" value="admin123" required placeholder="Ingresa tu contraseña">
            <button type="button" class="btn-toggle-password" id="togglePassword">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <!-- Opciones secundarias -->
        <div class="d-flex align-items-center justify-content-between pt-1">
          <div class="form-check">
            <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-slate-600 fw-medium" for="rememberMe">Mantener sesión</label>
          </div>
          <span class="small-mono text-slate-400">Rate-limit activo</span>
        </div>

        <!-- Botón de Envío -->
        <div class="pt-2">
          <button type="submit" class="btn btn-cta w-100">
            <span>INGRESAR A IQFLEET</span>
            <i class="fa-solid fa-arrow-right fs-7"></i>
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- Pie de página -->
  <footer class="w-100 max-w-6xl py-3 px-3 text-center d-sm-flex justify-content-sm-between align-items-sm-center small text-slate-400">
    <p class="m-0 mb-2 mb-sm-0">Acceso exclusivo para empresas aliadas y operadores habilitados.</p>
    <div class="d-flex justify-content-center gap-4">
      <a href="#" class="footer-link">Términos</a>
      <a href="#" class="footer-link">Privacidad</a>
      <a href="#" class="footer-link">Estado de Servidores</a>
    </div>
  </footer>

</body>
</html>
